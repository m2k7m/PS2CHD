name: ISO to CHD

on:
  workflow_dispatch:
    inputs:
      filename:
        description: Game name (with or without .iso/.chd; no sensitive information)
        required: true
        default: game
        type: string
      disc_type:
        description: Disc detection (auto, or manual override)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - dvd
          - cd
      viking_folder:
        description: VikingFile folder (empty, root or ... uploads to account root)
        required: false
        default: PS2
        type: string

permissions: {}

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - name: Install chdman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mame-tools

      - name: Download, convert, verify and upload
        env:
          ISO_URL: ${{ secrets.ISO_URL }}
          VIKINGFILE_USER_HASH: ${{ secrets.VIKINGFILE_USER_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OUTPUT_NAME: ${{ inputs.filename }}
          DISC_TYPE: ${{ inputs.disc_type }}
          VIKING_FOLDER: ${{ inputs.viking_folder }}
        run: |
          python3 - <<'PY'
          import json
          from contextlib import contextmanager
          from datetime import datetime, timezone
          import math
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tempfile
          import threading
          import time
          import urllib.parse
          import urllib.error
          import urllib.request

          API = "https://vikingfile.com/api/"
          BLOCK = 1024 * 1024
          MAX_ISO = 9 * 1024**3
          RESERVE = 1024**3

          class WorkflowError(RuntimeError):
              """A deliberately safe, user-facing error message."""

          class ConfigurationError(WorkflowError):
              pass

          def detect_disc(path, requested="auto"):
              if requested in ("dvd", "cd"):
                  return requested, "Manual override"
              if requested != "auto":
                  raise ConfigurationError("Disc type must be auto, dvd or cd.")
              # Standard 2048-byte ISO images omit physical media information.
              # Use positive filesystem markers before considering size.
              with path.open("rb") as source:
                  source.seek(16 * 2048)
                  descriptors = source.read(240 * 2048)
              udf = any(descriptors[offset + 1:offset + 6] in (b"NSR02", b"NSR03")
                        for offset in range(0, len(descriptors), 2048))
              xa = descriptors[1024:1032] == b"CD-XA001"
              if udf and xa:
                  raise ConfigurationError("Conflicting disc markers. Select dvd or cd manually after checking the original disc.")
              if udf:
                  return "dvd", "UDF volume recognition marker"
              if xa:
                  return "cd", "CD-ROM XA marker"
              if path.stat().st_size > 1024**3:
                  return "dvd", "Image exceeds 1 GiB, beyond an original PS2 CD capacity"
              raise ConfigurationError("Disc type is ambiguous: this small ISO has no UDF or CD-XA marker. Run again with disc_type set to dvd or cd for the original disc.")

          class TransferStats:
              def __init__(self):
                  self.lock = threading.Lock()
                  self.started = None
                  self.ended = None
                  self.bytes = 0
                  self.total = None

              def begin(self, total=None):
                  with self.lock:
                      self.started = time.monotonic()
                      self.ended = None
                      self.bytes = 0
                      self.total = total

              def record(self, count):
                  with self.lock:
                      self.bytes += count

              def finish(self):
                  with self.lock:
                      if self.started is not None and self.ended is None:
                          self.ended = time.monotonic()

              def text(self):
                  with self.lock:
                      if self.started is None:
                          return "— Pending"
                      elapsed = (self.ended if self.ended is not None else time.monotonic()) - self.started
                      rate = self.bytes / max(elapsed, 0.001) / 1024**2
                      return f"{rate:,.2f} MiB/s average\n{self.bytes / 1024**2:,.2f} MiB transferred"

          def network_detail(error):
              if isinstance(error, urllib.error.HTTPError):
                  return f"HTTP {int(error.code)}"
              return "connection, timeout or response error"

          def byte_count(value):
              # VikingFile returns decimal strings in live completion responses.
              if type(value) is int and value >= 0:
                  return value
              if isinstance(value, str) and re.fullmatch(r"[0-9]+", value.strip()):
                  return int(value.strip())
              return None

          def human_size(value):
              magnitude = abs(value)
              unit, divisor = ("GiB", 1024**3) if magnitude >= 1024**3 else ("MiB", 1024**2)
              return f"{value / divisor:,.2f} {unit} ({value:,} bytes)"

          def savings(original, compressed):
              if original is None or compressed is None or original <= 0:
                  return None
              saved = original - compressed
              percent = abs(saved) / original * 100
              if saved >= 0:
                  return f"{human_size(saved)} · {percent:.2f}% saved"
              return f"{human_size(-saved)} · {percent:.2f}% larger"

          def output_filename(value):
              name = value.strip()
              if (not name or not name[0].isalnum()
                      or not re.fullmatch(r"[\w .()\[\]'&+,-]{1,160}", name)):
                  raise ConfigurationError(
                      "Invalid filename. Use 1-160 letters, digits, spaces, dots, parentheses, brackets, apostrophes, ampersands, plus signs, commas, underscores or hyphens, starting with a letter or digit. Paths are not allowed.")
              if name.lower().endswith(".chd"):
                  return name
              suffix = Path(name).suffix
              if suffix.lower() in (".iso", ".bin", ".img", ".cue", ".mdf", ".nrg", ".cso"):
                  name = name[:-len(suffix)]
              return name + ".chd"

          def remote_folder(value):
              folder = value.strip()
              if folder.lower() in ("", "root", "..."):
                  return ""
              parts = folder.split("/")
              if (len(folder) > 255 or any(part.strip() in ("", ".", "..")
                      or not re.fullmatch(r"[\w .()\[\]'&+,-]+", part) for part in parts)):
                  raise ConfigurationError("Invalid VikingFile folder. Use folder names separated by /, without empty segments, backslashes or parent-directory references (maximum 255 characters).")
              return folder

          def notifications_configured():
              # Partial or invalid notification settings must not expose results
              # through a fallback in GitHub logs or the run summary.
              return any(os.environ.get(key, "").strip() for key in
                         ("DISCORD_WEBHOOK_URL", "TELEGRAM_BOT_TOKEN", "TELEGRAM_USER_ID"))

          def https_url(value, viking=False):
              parsed = urllib.parse.urlsplit(value)
              host = (parsed.hostname or "").lower()
              if (parsed.scheme != "https" or not host or parsed.username
                      or parsed.password or parsed.fragment):
                  raise ValueError("An HTTPS URL without credentials or fragments is required.")
              if viking and not (host == "vikingfile.com" or host.endswith(".vikingfile.com")):
                  raise ValueError("Unexpected VikingFile hostname.")
              return value

          class HTTPSRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  https_url(newurl)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          OPENER = urllib.request.build_opener(HTTPSRedirect())

          def api_call(endpoint, fields):
              data = urllib.parse.urlencode(fields).encode()
              request = urllib.request.Request(API + endpoint, data=data)
              with OPENER.open(request, timeout=120) as response:
                  result = json.loads(response.read(2 * BLOCK))
              if not isinstance(result, dict) or result.get("error"):
                  raise ValueError("VikingFile rejected the API request.")
              return result

          def download(url, target, stats=None):
              # Redirects may contain signed tokens: never print URLs or exceptions.
              request = urllib.request.Request(url, headers={"User-Agent": "PS2CHD/1.0"})
              if stats is not None:
                  stats.begin()
              with OPENER.open(request, timeout=120) as response, target.open("wb") as output:
                  expected = response.headers.get("Content-Length")
                  expected = int(expected) if expected is not None else None
                  if expected is not None and (expected <= 0 or expected > MAX_ISO):
                      raise ValueError("ISO size exceeds the supported limit.")
                  if expected and shutil.disk_usage(target.parent).free < 2 * expected + RESERVE:
                      raise ValueError("Insufficient space for ISO and CHD.")
                  total = 0
                  while True:
                      block = response.read(BLOCK)
                      if not block:
                          break
                      total += len(block)
                      if total > MAX_ISO:
                          raise ValueError("ISO size exceeds the supported limit.")
                      # Leave space for a potentially incompressible CHD as well.
                      if shutil.disk_usage(target.parent).free < total + len(block) + RESERVE:
                          raise ValueError("Insufficient disk space.")
                      output.write(block)
                      if stats is not None:
                          stats.record(len(block))
              if total == 0 or (expected is not None and total != expected):
                  raise ValueError("Empty or incomplete download.")
              # ISO9660 volume descriptor, also present on standard PS2 DVD ISOs.
              with target.open("rb") as source:
                  source.seek(16 * 2048 + 1)
                  if source.read(5) != b"CD001":
                      raise ValueError("Expected a raw ISO9660 ISO, not HTML or an archive.")
              if total % 2048:
                  raise ValueError("ISO must contain complete 2048-byte sectors.")
              print(f"ISO downloaded: {total:,} bytes", flush=True)
              if stats is not None:
                  stats.finish()

          def file_blocks(source, length, stats=None):
              remaining = length
              while remaining:
                  block = source.read(min(BLOCK, remaining))
                  if not block:
                      raise ValueError("Unexpected end of CHD file.")
                  remaining -= len(block)
                  yield block
                  if stats is not None:
                      stats.record(len(block))

          def upload_part(path, url, offset, length, stats=None):
              # Signed storage URLs come from VikingFile's HTTPS API and may use
              # external S3 providers (currently OVH), not a vikingfile.com host.
              try:
                  https_url(url)
              except Exception:
                  raise WorkflowError("VikingFile returned an invalid HTTPS storage URL.") from None
              # Do not redirect a PUT containing file data to another destination.
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs):
                      return None
              opener = urllib.request.build_opener(NoRedirect())
              for attempt in range(3):
                  try:
                      with path.open("rb") as source:
                          source.seek(offset)
                          request = urllib.request.Request(
                              url, data=file_blocks(source, length, stats), method="PUT",
                              headers={"Content-Length": str(length),
                                       "Content-Type": "application/octet-stream"})
                          with opener.open(request, timeout=300) as response:
                              etag = response.headers.get("ETag")
                              if not etag:
                                  raise WorkflowError("Storage upload response has no ETag.")
                              return etag
                  except Exception as error:
                      if isinstance(error, urllib.error.HTTPError):
                          error.close()
                      if attempt == 2:
                          detail = str(error) if isinstance(error, WorkflowError) else network_detail(error)
                          raise WorkflowError(f"Part upload failed after three attempts: {detail}.") from None
                      time.sleep(5 * (attempt + 1))

          def upload(path, user, stats=None, folder=""):
              size = path.stat().st_size
              if stats is not None:
                  stats.begin(size)
              plan = api_call("get-upload-url", {"size": size})
              part_size = plan.get("partSize")
              urls = plan.get("urls")
              if not isinstance(part_size, int) or part_size <= 0 or not isinstance(urls, list):
                  raise ValueError("Invalid upload plan.")
              count = math.ceil(size / part_size)
              if len(urls) != count or plan.get("numberParts") != count:
                  raise ValueError("Upload plan does not match file size.")
              fields = {"key": plan["key"], "uploadId": plan["uploadId"],
                        "name": path.name, "user": user}
              if folder:
                  fields["path"] = folder
              for index, url in enumerate(urls):
                  print(f"Uploading part {index + 1}/{count}", flush=True)
                  offset = index * part_size
                  etag = upload_part(path, url, offset, min(part_size, size - offset), stats=stats)
                  fields[f"parts[{index}][PartNumber]"] = index + 1
                  fields[f"parts[{index}][ETag]"] = etag
              # Do not blindly retry completion: the first request may have succeeded.
              result = api_call("complete-upload", fields)
              link = https_url(result["url"], viking=True)
              if byte_count(result.get("size")) != size:
                  raise WorkflowError("VikingFile completed the request, but its reported file size does not match the CHD. Check the file in your account before rerunning.")
              if result.get("name") != path.name:
                  raise WorkflowError("VikingFile completed the request, but its reported filename does not match the CHD. Check the file in your account before rerunning.")
              if stats is not None:
                  stats.finish()
              return link

          def notification_request(url, payload, headers=None, method="POST"):
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs):
                      return None
              # Never forward bot credentials through redirects.
              opener = urllib.request.build_opener(NoRedirect())
              request = urllib.request.Request(
                  url, data=json.dumps(payload).encode(), method=method,
                  headers={"Content-Type": "application/json",
                           "User-Agent": "DiscordBot (https://github.com, 1.0)",
                           **(headers or {})})
              with opener.open(request, timeout=30) as response:
                  return json.loads(response.read(BLOCK))

          def duration(seconds):
              seconds = max(0, int(seconds))
              hours, seconds = divmod(seconds, 3600)
              minutes, seconds = divmod(seconds, 60)
              return f"{hours:02d}:{minutes:02d}:{seconds:02d}"

          class DiscordProgress:
              STAGES = ("Downloading", "Compressing", "Verifying", "Uploading")

              def __init__(self, name):
                  self.name = name
                  self.webhook = ""
                  self.message_id = None
                  self.state = "Task started"
                  self.started = time.monotonic()
                  self.ended = None
                  self.active = None
                  self.active_since = None
                  self.timings = {}
                  self.transfers = {stage: TransferStats() for stage in ("Downloading", "Uploading")}
                  self.disc = None
                  self.disc_reason = None
                  self.folder = ""
                  self.link = None
                  self.iso_size = None
                  self.size = None
                  self.failure_reason = None
                  self.sent = False
                  self.warned = False
                  self.lock = threading.RLock()
                  self.stop = threading.Event()
                  self.worker = None
                  raw = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
                  if raw:
                      try:
                          parsed = urllib.parse.urlsplit(https_url(raw))
                          if (parsed.netloc not in ("discord.com", "canary.discord.com", "ptb.discord.com")
                                  or not re.fullmatch(r"/api(?:/v[0-9]+)?/webhooks/[0-9]+/[A-Za-z0-9._-]+/?", parsed.path)
                                  or parsed.query):
                              raise ValueError("Invalid webhook URL.")
                          self.webhook = raw.rstrip("/")
                      except Exception:
                          self.warning()

              def warning(self):
                  if not self.warned:
                      print("::warning::Discord progress update failed. Check DISCORD_WEBHOOK_URL and webhook permissions. Result details will not be published in GitHub.", flush=True)
                      self.warned = True

              def elapsed(self):
                  return (self.ended if self.ended is not None else time.monotonic()) - self.started

              def timing_lines(self):
                  return "\n".join(f"{stage}: {duration(value)}" for stage, value in self.timings.items())

              def payload(self):
                  now = time.monotonic()
                  display_name = f"{self.folder}/{self.name}" if self.folder else self.name
                  fields = [{"name": "📀 Output", "value": f"`{display_name}`", "inline": False}]
                  if self.disc:
                      fields.append({"name": "Disc type", "value": f"{self.disc.upper()} · {self.disc_reason}", "inline": False})
                  for stage in self.STAGES:
                      if stage == self.active:
                          value = f"⏳ {duration(now - self.active_since)} · in progress"
                      elif stage in self.timings:
                          icon = "❌" if self.state == "Failed" and stage == self.failed_stage else "✅"
                          value = f"{icon} {duration(self.timings[stage])}"
                      else:
                          value = "— Pending"
                      fields.append({"name": stage, "value": value, "inline": True})
                  fields.append({"name": "⏱ Total elapsed", "value": duration(self.elapsed()), "inline": True})
                  for stage, label in (("Downloading", "⬇ Download speed"), ("Uploading", "⬆ Upload speed")):
                      fields.append({"name": label, "value": self.transfers[stage].text(), "inline": True})
                  if self.iso_size is not None:
                      fields.append({"name": "💿 Original ISO size", "value": human_size(self.iso_size), "inline": True})
                  if self.size is not None:
                      fields.append({"name": "📦 CHD size", "value": human_size(self.size), "inline": True})
                  saved = savings(self.iso_size, self.size)
                  if saved is not None:
                      fields.append({"name": "💾 Space savings", "value": saved, "inline": True})
                  if self.link:
                      fields.append({"name": "🔗 Download", "value": f"[Download CHD from VikingFile]({self.link})", "inline": False})
                  if self.failure_reason:
                      fields.append({"name": "Failure reason", "value": self.failure_reason, "inline": False})
                  description = {"Task started": "Your conversion task has started.",
                                 "Completed": "Your CHD is verified and ready to download.",
                                 "Failed": "Processing stopped. Check the Actions log for details."}.get(
                                     self.state, f"{self.state} your game. This message refreshes every 30 seconds.")
                  embed = {"title": f"{'✅' if self.state == 'Completed' else '❌' if self.state == 'Failed' else '⚙️'} PS2CHD • {self.state}",
                           "description": description, "color": 0x2ECC71 if self.state == "Completed" else 0xE74C3C if self.state == "Failed" else 0x5865F2,
                           "fields": fields, "timestamp": datetime.now(timezone.utc).isoformat(),
                           "footer": {"text": "PS2CHD • ISO → CHD → VikingFile | Times: HH:MM:SS"}}
                  repository = os.environ.get("GITHUB_REPOSITORY", "")
                  run_id = os.environ.get("GITHUB_RUN_ID", "")
                  if re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository) and run_id.isdigit():
                      embed["url"] = f"https://github.com/{repository}/actions/runs/{run_id}"
                  return {"embeds": [embed], "allowed_mentions": {"parse": []}}

              def publish(self):
                  with self.lock:
                      if not self.webhook:
                          return
                      creating = self.message_id is None
                      try:
                          url = self.webhook + ("?wait=true" if creating else f"/messages/{self.message_id}")
                          result = notification_request(url, self.payload(), method="POST" if creating else "PATCH")
                          if not isinstance(result, dict) or not re.fullmatch(r"[0-9]+", str(result.get("id", ""))):
                              raise ValueError("Discord did not confirm the message.")
                          if not creating and str(result["id"]) != self.message_id:
                              raise ValueError("Discord returned a different message.")
                          self.message_id = str(result["id"])
                          self.sent = True
                      except Exception as error:
                          if isinstance(error, urllib.error.HTTPError):
                              error.close()
                          self.sent = False
                          self.warning()
                          if creating:
                              # An uncertain POST may already have created a message.
                              # Do not create duplicates by automatically retrying it.
                              self.webhook = ""

              def heartbeat(self):
                  while not self.stop.wait(30):
                      self.publish()

              def begin(self):
                  self.publish()
                  if self.message_id:
                      self.worker = threading.Thread(target=self.heartbeat, daemon=True)
                      self.worker.start()

              @contextmanager
              def phase(self, stage):
                  with self.lock:
                      self.state = stage
                      self.active = stage
                      self.active_since = time.monotonic()
                  self.publish()
                  # Time the operation itself, excluding the stage-change request.
                  with self.lock:
                      self.active = stage
                      self.active_since = time.monotonic()
                  try:
                      yield
                  finally:
                      with self.lock:
                          self.timings[stage] = time.monotonic() - self.active_since
                          self.active = None
                      if stage in self.transfers:
                          self.transfers[stage].finish()

              def finish(self, failed=False, size=None, link=None, reason=None):
                  self.stop.set()
                  for transfer in self.transfers.values():
                      transfer.finish()
                  if self.worker:
                      self.worker.join()
                  with self.lock:
                      self.failed_stage = self.state
                      self.state = "Failed" if failed else "Completed"
                      self.ended = time.monotonic()
                      if size is not None:
                          self.size = size
                      if link is not None:
                          self.link = link
                      self.failure_reason = reason
                  self.publish()
                  return self.sent

          def notify_result(name, size, link, progress):
              message = (f"CHD conversion complete\nFile: {name}\nSize: {size:,} bytes\nDownload: {link}\n"
                         f"{progress.timing_lines()}\nTotal elapsed: {duration(progress.elapsed())}")
              if progress.iso_size is not None:
                  message += (f"\nOriginal ISO: {human_size(progress.iso_size)}\nCHD: {human_size(size)}"
                              f"\nSpace savings: {savings(progress.iso_size, size)}")
              message += f"\nVikingFile folder: {progress.folder or 'root'}"
              if progress.disc:
                  message += f"\nDisc type: {progress.disc.upper()} ({progress.disc_reason})"
              message += (f"\nDownload speed: {progress.transfers['Downloading'].text()}"
                          f"\nUpload speed: {progress.transfers['Uploading'].text()}")
              token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              target = os.environ.get("TELEGRAM_USER_ID", "").strip()
              if token or target:
                  try:
                      if not re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token) or not re.fullmatch(r"[0-9]+", target):
                          raise ValueError("Set both Telegram secrets correctly.")
                      result = notification_request(f"https://api.telegram.org/bot{token}/sendMessage",
                                                    {"chat_id": target, "text": message})
                      if not isinstance(result, dict) or result.get("ok") is not True:
                          raise ValueError("Telegram rejected the notification.")
                      print("Telegram notification sent.", flush=True)
                  except Exception as error:
                      if isinstance(error, urllib.error.HTTPError):
                          error.close()
                      print("::warning::Telegram notification failed. Check both Telegram secrets and start the bot's private chat.", flush=True)
              if not notifications_configured():
                  print(message, flush=True)

          def main():
              stage = "Validating configuration"
              progress = DiscordProgress("Preparing task")
              try:
                  url = os.environ.get("ISO_URL", "").strip()
                  user = os.environ.get("VIKINGFILE_USER_HASH", "").strip()
                  if not url or not user:
                      raise ConfigurationError("Add ISO_URL and VIKINGFILE_USER_HASH as Actions secrets.")
                  try:
                      https_url(url)
                  except Exception:
                      raise ConfigurationError("ISO_URL must be a valid HTTPS URL without embedded credentials or a fragment.") from None
                  name = output_filename(os.environ.get("OUTPUT_NAME", "game"))
                  folder = remote_folder(os.environ.get("VIKING_FOLDER", ""))
                  disc = os.environ.get("DISC_TYPE", "auto")
                  if disc not in ("auto", "dvd", "cd"):
                      raise ConfigurationError("Disc type must be auto, dvd or cd.")
                  progress.name = name
                  progress.folder = folder
                  progress.begin()
                  with tempfile.TemporaryDirectory(prefix="ps2chd-", dir=os.environ.get("RUNNER_TEMP")) as work_dir:
                      iso = Path(work_dir) / "source.iso"
                      chd = Path(work_dir) / name
                      stage = "Downloading ISO"
                      print(stage, flush=True)
                      with progress.phase("Downloading"):
                          download(url, iso, stats=progress.transfers["Downloading"])
                      with progress.lock:
                          progress.iso_size = iso.stat().st_size
                      stage = "Detecting disc type"
                      with progress.lock:
                          progress.state = stage
                      disc, reason = detect_disc(iso, disc)
                      progress.disc, progress.disc_reason = disc, reason
                      print(f"Disc type: {disc.upper()} ({reason})", flush=True)
                      stage = "Converting ISO"
                      print(stage, flush=True)
                      with progress.phase("Compressing"):
                          subprocess.run(["chdman", "create" + disc, "-i", str(iso), "-o", str(chd)], check=True)
                      with progress.lock:
                          progress.size = chd.stat().st_size
                      stage = "Verifying CHD"
                      print(stage, flush=True)
                      with progress.phase("Verifying"):
                          subprocess.run(["chdman", "verify", "-i", str(chd)], check=True)
                      iso.unlink()
                      stage = "Uploading CHD"
                      print(stage, flush=True)
                      with progress.phase("Uploading"):
                          link = upload(chd, user, stats=progress.transfers["Uploading"], folder=folder)
                      size = chd.stat().st_size
                      progress.finish(size=size, link=link)
                      if not notifications_configured():
                          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                              summary.write(f"## Conversion complete\n\nFile: `{name}`\n\n[VikingFile download]({link})\n")
                              summary.write(f"\n```text\n{progress.timing_lines()}\nTotal elapsed: {duration(progress.elapsed())}\n```\n")
                              summary.write(f"\nDisc type: {disc.upper()} ({reason})\n\nDownload: {progress.transfers['Downloading'].text()}\n\nUpload: {progress.transfers['Uploading'].text()}\n")
                              summary.write(f"\nOriginal ISO: {human_size(progress.iso_size)}\n\nCHD: {human_size(size)}\n\nSpace savings: {savings(progress.iso_size, size)}\n\nVikingFile folder: `{folder or 'root'}`\n")
                      print("Upload complete.", flush=True)
                      notify_result(name, size, link, progress)
              except Exception as error:
                  detail = (str(error) if isinstance(error, WorkflowError) else
                            f"{stage} failed: {network_detail(error)}." if isinstance(error, urllib.error.URLError) else
                            f"{stage} failed. Check source availability, disk space and VikingFile account/service status.")
                  if isinstance(error, urllib.error.HTTPError):
                      error.close()
                  if progress.ended is None:
                      progress.finish(failed=True, reason=detail)
                  # API bodies, redirect URLs and tracebacks can expose secrets.
                  raise WorkflowError(detail) from None

          if __name__ == "__main__":
              try:
                  main()
              except WorkflowError as error:
                  print(f"::error::{error}", flush=True)
                  raise SystemExit(1)
              except Exception:
                  # Even URL parsing errors can contain the original secret value.
                  print("::error::Conversion/upload failed. Check both Actions secrets, filename, disc type, source availability, disk space and VikingFile status.", flush=True)
                  raise SystemExit(1)
          PY
